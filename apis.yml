name: 1047 Games
description: '1047 Games is an independent video game studio best known for the arena
  shooter Splitgate and its follow-up title EMPULSE, a free-to-play movement shooter.
  Backed by Insight Partners and Lightspeed Venture Partners, the studio ships games
  across PC (Steam), PlayStation, and Xbox. As a consumer game publisher it exposes
  no public developer API; this profile tracks its public web, legal, and community
  surfaces for the API Evangelist network. Added originally as a VC-portfolio lead
  and enriched with live domain-security and identity probes.'
